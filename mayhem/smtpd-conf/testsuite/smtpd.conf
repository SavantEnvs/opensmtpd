# macros, tables, pki-less listeners, actions and matches
lan = "192.168.0.0/16"
table aliases file:/etc/hosts
table vdomains { example.org, example.net }
table vusers { bob@example.org = bob, @example.net = carol }
table trusted { $lan, 10.0.0.0/8 }
listen on lo port 25 tag LOCAL hostname mx.example.org
listen on socket
queue compression
action "local_mail" mbox alias <aliases>
action "virtual" maildir "~/Maildir" junk virtual <vusers>
action "relay" relay host smtp://mx.example.com:2525 helo mx.example.org
action "lmtp" lmtp "/var/run/dovecot/lmtp" rcpt-to
match from local for local action "local_mail"
match from src <trusted> for domain <vdomains> action "virtual"
match from any auth for any action "relay"
match from local for any !mail-from "<>" action "lmtp"
