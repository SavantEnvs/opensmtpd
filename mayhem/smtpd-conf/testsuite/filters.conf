filter "rdns" phase connect match !rdns disconnect "550 no rDNS"
filter "fcrdns" phase connect match !fcrdns junk
filter chain "default" { "rdns", "fcrdns" }
srs key "secret"
smtp max-message-size 35M
listen on 0.0.0.0 port 587 filter "default" mask-src senders <users> auth-optional
action "out" relay srs
match for any action "out"
